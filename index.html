/* ---------------------------- mock data ---------------------------- */
function pad(n) { return String(n).padStart(2, "0"); }
function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function weighted(pairs) {
  const total = pairs.reduce((s, p) => s + p[1], 0);
  let r = Math.random() * total;
  for (const [v, w] of pairs) { if (r < w) return v; r -= w; }
  return pairs[0][0];
}

function generateData() {
  const today = new Date(2026, 7, 12); // Aug 12 2026
  const start = new Date(2026, 6, 1); // Jul 1 2026
  const jobs = [];
  let id = 1;
  const typeWeights = [
    ["campaign", 15], ["content", 20], ["ecommerce", 26], ["analytics", 12],
    ["creative", 15], ["meeting", 9], ["problem", 8], ["other", 9],
  ];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const day = new Date(d);
    const dow = day.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const base = isWeekend ? weighted([[0, 6], [1, 3], [2, 1]]) : weighted([[6, 2], [8, 4], [10, 5], [13, 3], [16, 2]]);
    for (let i = 0; i < base; i++) {
      const type = weighted(typeWeights);
      const member = rand(MEMBERS);
      const project = Math.random() < 0.72 ? rand(PROJECTS) : null;
      const isToday = toISO(day) === toISO(today);
      const isRecent = (today - day) / 86400000 <= 2;
      const status = isToday ? weighted([["todo", 3], ["doing", 5], ["done", 4]])
        : isRecent ? weighted([["doing", 3], ["done", 7]])
        : "done";
      jobs.push({
        id: id++,
        title: rand(TITLE_POOL[type]),
        description: "",
        owner: member.id,
        date: toISO(day),
        jobType: type,
        project: project ? project.id : null,
        status,
        note: "",
        createdAt: toISO(day),
      });
    }
  }
  return jobs;
}

function Card({ children, style, onClick, className }) {

function SectionTitle({ eyebrow, title, sub }) {

    </div>

}
function Donut({ segments, size = 120, thickness = 16 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let acc = 0;
  const stops = segments.map((s) => {
    const pct = (s.value / total) * 100;
    const str = `${s.color} ${acc}% ${acc + pct}%`;
    acc += pct;
    return str;
  }).join(", ");
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: `conic-gradient(${stops})`, position: "relative", flexShrink: 0 }}>
      <div style={{ position: "absolute", inset: thickness, borderRadius: "50%", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column" }}>
        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontWeight: 600, fontSize: size * 0.16, color: "#17132A" }}>{total}</div>
        <div style={{ fontSize: size * 0.08, color: "#9A97A8" }}>jobs</div>
      </div>
    </div>
  );
}
function Bar({ label, value, max, color }) {
  const pct = Math.max(3, (value / max) * 100);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
      <div style={{ width: 140, fontSize: 13, color: "#4A4759", flexShrink: 0 }}>{label}</div>
      <div style={{ flex: 1, background: "#F2EFF9", borderRadius: 8, height: 14, overflow: "hidden" }}>
        <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 8, transition: "width .4s ease" }} />
      </div>
      <div style={{ width: 36, textAlign: "right", fontFamily: "'IBM Plex Mono',monospace", fontSize: 13, color: "#17132A", flexShrink: 0 }}>{value}</div>
    </div>
  );
}

function MyJobsView({ jobs, openJob, todayISO }) {
  const [range, setRange] = useState("week");

  const [statusFilter, setStatusFilter] = useState("all");
  const mine = jobs.filter((j) => j.owner === "tai");

  const weekAgo = new Date(2026, 7, 5);
  const monthAgo = new Date(2026, 7, 1);
  const filtered = mine.filter((j) => {
    const d = new Date(j.date);
    if (range === "today" && j.date !== todayISO) return false;
    if (range === "week" && d < weekAgo) return false;
    if (range === "month" && d < monthAgo) return false;
    if (typeFilter !== "all" && j.jobType !== typeFilter) return false;

/* ---------------------------- CALENDAR ---------------------------- */
function CalendarView({ jobs, openJob }) {
  const [month, setMonth] = useState(7); // 0-indexed, Aug=7
  const [memberFilter, setMemberFilter] = useState("all");
  const [selectedDay, setSelectedDay] = useState(null);
  const year = 2026;
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const filteredJobs = memberFilter === "all" ? jobs : jobs.filter((j) => j.owner === memberFilter);
  const byDay = {};
  filteredJobs.forEach((j) => { (byDay[j.date] = byDay[j.date] || []).push(j); });

  const dayJobs = selectedDay ? (byDay[selectedDay] || []) : [];

  return (
    <div>
      <SectionTitle eyebrow="Day by day" title="Calendar" />
      <div style={{ display: "flex", gap: 20 }}>
        <Card style={{ padding: 20, flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            <button onClick={() => setMonth((m) => Math.max(6, m - 1))} style={iconBtn}>‹</button>
            <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700 }}>{new Date(year, month, 1).toLocaleString("en-US", { month: "long" })} {year}</div>

          </select>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6 }}>

            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const iso = `${year}-${pad(month + 1)}-${pad(d)}`;
              const dj = byDay[iso] || [];
              const counts = {};
              dj.forEach((j) => { counts[j.jobType] = (counts[j.jobType] || 0) + 1; });
              return (
                <div key={i} onClick={() => setSelectedDay(iso)} style={{ minHeight: 62, borderRadius: 10, padding: 6, cursor: "pointer", background: selectedDay === iso ? "#F1E6FE" : "#FBF7EF", border: selectedDay === iso ? "1px solid #6D4CFF" : "1px solid transparent" }}>

                    {Object.entries(counts).slice(0, 4).map(([t]) => <span key={t} style={{ width: 6, height: 6, borderRadius: 999, background: jt(t).color }} />)}
                  </div>
                  {dj.length > 0 && <div style={{ fontSize: 10, color: "#9A97A8", marginTop: 3 }}>{dj.length} jobs</div>}
                </div>
              );
            })}
          </div>
        </Card>
        <Card style={{ padding: 18, width: 300, flexShrink: 0, maxHeight: 480, overflowY: "auto" }}>
          <div style={{ fontWeight: 700, fontFamily: "'Space Grotesk',sans-serif", marginBottom: 10 }}>{selectedDay || "Pick a day"}</div>
          {dayJobs.length === 0 && <div style={{ fontSize: 13, color: "#9A97A8" }}>No jobs logged.</div>}

            );
          })}
        </Card>
      </div>
    </div>
  );

/* ---------------------------- MONTHLY RECAP ---------------------------- */
const AVAILABLE_MONTHS = ["2026-07", "2026-08"];
function computeAchievements(jobs) {
  const perMember = {};
  MEMBERS.forEach((m) => { perMember[m.id] = jobs.filter((j) => j.owner === m.id); });
  const most = (fn) => Object.entries(perMember).sort((a, b) => fn(b[1]) - fn(a[1]))[0];
  const jobMachine = most((js) => js.length);
  const campaignSlayer = most((js) => js.filter((j) => j.jobType === "campaign").length);
  const creativeGoblin = most((js) => js.filter((j) => j.jobType === "creative").length);
  const dataNerd = most((js) => js.filter((j) => j.jobType === "analytics").length);
  const fireFighter = most((js) => js.filter((j) => j.jobType === "problem").length);
  const multitasker = most((js) => new Set(js.map((j) => j.jobType)).size);
  const teamPlayer = most((js) => new Set(js.filter((j) => j.project).map((j) => j.project)).size);
  const badge = (icon, title, desc, entry, valueFn) => ({ icon, title, desc, name: MEMBERS.find((m) => m.id === entry[0]).name, value: valueFn(entry[1]) });
  return [
    badge("🔥", "Job Machine", "Did the most jobs this stretch", jobMachine, (js) => js.length),
    badge("🎯", "Campaign Slayer", "Most campaign jobs", campaignSlayer, (js) => js.filter((j) => j.jobType === "campaign").length),
    badge("🎨", "Creative Goblin", "Most creative jobs", creativeGoblin, (js) => js.filter((j) => j.jobType === "creative").length),
    badge("📊", "Data Nerd", "Most analytics jobs", dataNerd, (js) => js.filter((j) => j.jobType === "analytics").length),
    badge("🧯", "Fire Fighter", "Most problem-solving jobs", fireFighter, (js) => js.filter((j) => j.jobType === "problem").length),
    badge("⚡", "The Multitasker", "Touched the most job types", multitasker, (js) => new Set(js.map((j) => j.jobType)).size),
    badge("🫡", "Team Player", "Worked across the most projects", teamPlayer, (js) => new Set(js.filter((j) => j.project).map((j) => j.project)).size),
  ];
}

function RecapView({ jobs }) {
  const [monthIdx, setMonthIdx] = useState(AVAILABLE_MONTHS.length - 1);
  const monthKey = AVAILABLE_MONTHS[monthIdx];
  const monthJobs = jobs.filter((j) => j.date.startsWith(monthKey));
  const monthLabel = new Date(monthKey + "-01").toLocaleString("en-US", { month: "long", year: "numeric" });

  const byType = {};
  monthJobs.forEach((j) => { byType[j.jobType] = (byType[j.jobType] || 0) + 1; });
  const donutSegs = JOB_TYPES.map((t) => ({ label: t.label, color: t.color, value: byType[t.id] || 0 })).filter((s) => s.value > 0);
  const maxType = Math.max(1, ...Object.values(byType));

  const byDay = {};
  monthJobs.forEach((j) => { byDay[j.date] = (byDay[j.date] || 0) + 1; });
  const busiestDays = Object.entries(byDay).sort((a, b) => b[1] - a[1]).slice(0, 3);

  const byMember = {};
  monthJobs.forEach((j) => { byMember[j.owner] = (byMember[j.owner] || 0) + 1; });
  const jobMakers = Object.entries(byMember).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const achievements = computeAchievements(monthJobs.length ? monthJobs : jobs);
  const campaignsTouched = new Set(monthJobs.filter((j) => j.jobType === "campaign" && j.project).map((j) => j.project)).size;
  const weeklyTimeline = useMemo(() => {
    const weeks = {};
    monthJobs.forEach((j) => {
      const d = new Date(j.date);
      const weekOf = new Date(d); weekOf.setDate(d.getDate() - d.getDay());
      const key = toISO(weekOf);
      weeks[key] = weeks[key] || {};
      weeks[key][j.jobType] = (weeks[key][j.jobType] || 0) + 1;
    });
    return Object.entries(weeks).sort();
  }, [monthJobs]);

  return (
    <div style={{ background: "#17132A", margin: -28, padding: 28, borderRadius: 20, color: "#fff" }}>
      <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 14, marginBottom: 8 }}>
        <button disabled={monthIdx === 0} onClick={() => setMonthIdx((i) => i - 1)} style={{ ...iconBtn, background: "transparent", borderColor: "#3B3560", color: "#fff", opacity: monthIdx === 0 ? 0.3 : 1 }}>‹</button>
        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 13, letterSpacing: 2, color: "#B8B5D1", textTransform: "uppercase" }}>{monthLabel}</div>
        <button disabled={monthIdx === AVAILABLE_MONTHS.length - 1} onClick={() => setMonthIdx((i) => i + 1)} style={{ ...iconBtn, background: "transparent", borderColor: "#3B3560", color: "#fff", opacity: monthIdx === AVAILABLE_MONTHS.length - 1 ? 0.3 : 1 }}>›</button>
      </div>

      <div style={{ textAlign: "center", padding: "30px 0 10px" }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 44, fontWeight: 700, background: "linear-gradient(90deg,#6D4CFF,#FF4F81)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>OH MY JOBB!</div>
        <div style={{ color: "#B8B5D1", marginTop: 6 }}>Look what we've been doing.</div>
        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 84, fontWeight: 600, marginTop: 18, lineHeight: 1 }}>{monthJobs.length}</div>
        <div style={{ letterSpacing: 3, color: "#9A97C0", fontSize: 13, textTransform: "uppercase", marginTop: 4 }}>Jobs</div>
        <div style={{ marginTop: 14, fontSize: 16, color: "#E4E1F5" }}>We really did all that. 😭</div>
      </div>

      <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 22, padding: 26, marginTop: 30, display: "flex", gap: 26, alignItems: "center", flexWrap: "wrap" }}>
        <Donut segments={donutSegs} size={140} />
        <div style={{ flex: 1, minWidth: 240 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 12 }}>The Job Universe</div>
          {JOB_TYPES.filter((t) => byType[t.id]).sort((a, b) => byType[b.id] - byType[a.id]).map((t) => (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
              <span style={{ width: 9, height: 9, borderRadius: 999, background: t.color }} />
              <span style={{ fontSize: 12.5, width: 130, color: "#D7D5E8" }}>{t.label}</span>
              <span style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 12.5 }}>{byType[t.id]}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18, marginTop: 18 }}>
        <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 22, padding: 24 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 12 }}>The Busiest Days</div>
          {busiestDays.map(([d, c], i) => (
            <div key={d} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: i < busiestDays.length - 1 ? "1px solid #2C2745" : "none" }}>
              <span style={{fontSize:14}}>🔥</span>
              <div style={{ fontSize: 13.5 }}>{new Date(d).toLocaleDateString("en-US", { day: "2-digit", month: "short" })}</div>
              <div style={{ flex: 1 }} />
              <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 13.5 }}>{c} jobs</div>
            </div>
          ))}
        </div>
        <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 22, padding: 24 }}>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 12 }}>Job Makers</div>
          {jobMakers.map(([mid, c]) => {
            const m = MEMBERS.find((x) => x.id === mid);
            return (
              <div key={mid} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0" }}>
                <Avatar member={m} size={26} />
                <div style={{ fontSize: 13.5, flex: 1 }}>{m.name}</div>
                <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 13.5, color: "#B8B5D1" }}>{c}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ marginTop: 18 }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 12 }}>Team Achievements</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(190px,1fr))", gap: 12 }}>
          {achievements.map((a) => (
            <div key={a.title} style={{ background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: 16 }}>
              <div style={{ fontSize: 22 }}>{a.icon}</div>
              <div style={{ fontWeight: 700, fontSize: 13.5, marginTop: 6 }}>{a.title}</div>
              <div style={{ fontSize: 11.5, color: "#9A97C0", marginTop: 2 }}>{a.desc}</div>
              <div style={{ fontSize: 12.5, color: "#FF9EBB", marginTop: 8, fontWeight: 600 }}>{a.name} · {a.value}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 18, background: "rgba(255,255,255,0.04)", borderRadius: 22, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 14 }}>What Did We Even Do?</div>
        {weeklyTimeline.map(([weekOf, types]) => {
          const top = Object.entries(types).sort((a, b) => b[1] - a[1])[0];
          const total = Object.values(types).reduce((s, v) => s + v, 0);
          return (
            <div key={weekOf} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: "1px solid #2C2745" }}>
              <div style={{ width: 76, fontSize: 12, color: "#9A97C0" }}>Week of {weekOf.slice(5)}</div>
              <Sticker type={top[0]} />
              <div style={{ fontSize: 12, color: "#9A97C0" }}>led the week</div>
              <div style={{ flex: 1 }} />
              <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 12.5 }}>{total} jobs</div>
            </div>
          );
        })}
      </div>

      <div style={{ textAlign: "center", padding: "40px 0 20px" }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 30, fontWeight: 700 }}>GOOD JOBB, TEAM. 🫶</div>
        <div style={{ color: "#B8B5D1", marginTop: 6, fontSize: 14 }}>Another month survived. Another mountain of work completed.</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 34, marginTop: 26, flexWrap: "wrap" }}>
          <div><div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 22, fontWeight: 600 }}>{monthJobs.length}</div><div style={{ fontSize: 11, color: "#9A97C0" }}>Jobs</div></div>
          <div><div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 22, fontWeight: 600 }}>{MEMBERS.length}</div><div style={{ fontSize: 11, color: "#9A97C0" }}>People</div></div>
          <div><div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 22, fontWeight: 600 }}>{campaignsTouched}</div><div style={{ fontSize: 11, color: "#9A97C0" }}>Campaigns</div></div>
          <div><div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 22, fontWeight: 600 }}>∞</div><div style={{ fontSize: 11, color: "#9A97C0" }}>Coffee</div></div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- ANALYTICS ---------------------------- */
function AnalyticsView({ jobs }) {
  const byType = {};
  jobs.forEach((j) => { byType[j.jobType] = (byType[j.jobType] || 0) + 1; });
  const maxType = Math.max(1, ...Object.values(byType));

  const byWeek = {};
  jobs.forEach((j) => {
    const d = new Date(j.date); const weekOf = new Date(d); weekOf.setDate(d.getDate() - d.getDay());
    const k = toISO(weekOf); byWeek[k] = (byWeek[k] || 0) + 1;
  });
  const weeks = Object.entries(byWeek).sort();
  const maxWeek = Math.max(1, ...weeks.map((w) => w[1]));

  const dowNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const byDow = [0, 0, 0, 0, 0, 0, 0];
  jobs.forEach((j) => { byDow[new Date(j.date).getDay()]++; });
  const maxDow = Math.max(1, ...byDow);

  const byProject = {};
  jobs.forEach((j) => { if (j.project) byProject[j.project] = (byProject[j.project] || 0) + 1; });
  const topProjects = Object.entries(byProject).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxProject = Math.max(1, ...topProjects.map((p) => p[1]));

  return (
    <div>
      <SectionTitle eyebrow="Storytelling, not spreadsheets" title="Analytics" />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 22 }}>
          <SectionTitle title="What kind of work do we do most?" />
          {JOB_TYPES.filter((t) => byType[t.id]).sort((a, b) => byType[b.id] - byType[a.id]).map((t) => (
            <Bar key={t.id} label={t.label} value={byType[t.id]} max={maxType} color={t.color} />
          ))}
        </Card>
        <Card style={{ padding: 22 }}>
          <SectionTitle title="Are we getting busier?" sub="Jobs per week" />
          <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 150 }}>
            {weeks.map(([k, v]) => (
              <div key={k} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <div style={{ width: "100%", height: `${(v / maxWeek) * 120}px`, background: "linear-gradient(180deg,#6D4CFF,#A98DFF)", borderRadius: "6px 6px 2px 2px" }} title={`${v} jobs`} />
                <div style={{ fontSize: 9, color: "#9A97A8" }}>{k.slice(8)}</div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ padding: 22 }}>
          <SectionTitle title="When do we get crazy?" sub="Jobs by day of week" />
          <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 130 }}>
            {byDow.map((v, i) => (
              <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                <div style={{ width: "100%", height: `${(v / maxDow) * 100}px`, background: i === 0 || i === 6 ? "#E4DFF0" : "#FF4F81", borderRadius: "6px 6px 2px 2px" }} />
                <div style={{ fontSize: 10, color: "#9A97A8" }}>{dowNames[i]}</div>
              </div>
            ))}
          </div>
        </Card>
        <Card style={{ padding: 22 }}>
          <SectionTitle title="What projects take the most work?" />
          {topProjects.map(([pid, v]) => (
            <Bar key={pid} label={PROJECTS.find((p) => p.id === pid).name.slice(0, 18)} value={v} max={maxProject} color="#8B3FE0" />
          ))}
        </Card>
      </div>
    </div>
  );
}

/* ---------------------------- ACHIEVEMENTS ---------------------------- */
function AchievementsView({ jobs }) {
  const achievements = computeAchievements(jobs);
  return (
    <div>
      <SectionTitle eyebrow="Fun stats" title="Achievements" sub="Not a leaderboard. Just vibes and bragging rights." />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(230px,1fr))", gap: 16 }}>
        {achievements.map((a) => (
          <Card key={a.title} style={{ padding: 22 }}>
            <div style={{ fontSize: 32 }}>{a.icon}</div>
            <div style={{ fontWeight: 700, fontFamily: "'Space Grotesk',sans-serif", fontSize: 16, marginTop: 8 }}>{a.title}</div>
            <div style={{ fontSize: 12.5, color: "#726F82", marginTop: 3 }}>{a.desc}</div>
            <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 8 }}>
              <Avatar member={MEMBERS.find((m) => m.name === a.name)} size={26} />
              <div style={{ fontWeight: 600, fontSize: 13.5 }}>{a.name}</div>
              <div style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono',monospace", fontSize: 13, color: "#6D4CFF" }}>{a.value}</div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------- APP ---------------------------- */
function OhMyJobb() {
  const [jobs, setJobs] = useState(() => generateData());
  const [view, setView] = useState("home");
  const [selectedMember, setSelectedMember] = useState(null);
  const [selectedProject, setSelectedProject] = useState(null);
  const [modalJob, setModalJob] = useState(undefined); // undefined=closed, null=new, obj=edit
  const [toast, setToast] = useState("");
  const todayISO = "2026-08-12";

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const openMember = (id) => { setSelectedMember(id); setView("memberDetail"); };
  const openProject = (id) => { setSelectedProject(id); setView("projectDetail"); };
  const handleSearchNav = (kind, id) => { if (kind === "member") openMember(id); else openProject(id); };

  const saveJob = (job) => {
    if (job.id) {
      setJobs((js) => js.map((j) => (j.id === job.id ? { ...j, ...job } : j)));
    } else {
      setJobs((js) => [{ ...job, id: Math.max(0, ...js.map((j) => j.id)) + 1 }, ...js]);
    }
    setModalJob(undefined);
    setToast(rand(TOAST_MESSAGES));
  };
  const deleteJob = (id) => {
    setJobs((js) => js.filter((j) => j.id !== id));
    setModalJob(undefined);
    setToast("Jobb removed.");
  };

  let content;
  if (view === "home") content = <HomeView jobs={jobs} openMember={openMember} openProject={openProject} todayISO={todayISO} />;
  else if (view === "myjobs") content = <MyJobsView jobs={jobs} openJob={setModalJob} todayISO={todayISO} />;
  else if (view === "team") content = <TeamView jobs={jobs} openMember={openMember} />;
  else if (view === "memberDetail") content = <MemberView id={selectedMember} jobs={jobs} back={() => setView("team")} />;
  else if (view === "calendar") content = <CalendarView jobs={jobs} openJob={setModalJob} />;
  else if (view === "projects") content = <ProjectsView jobs={jobs} openProject={openProject} />;
  else if (view === "projectDetail") content = <ProjectView id={selectedProject} jobs={jobs} back={() => setView("projects")} />;
  else if (view === "recap") content = <RecapView jobs={jobs} />;
  else if (view === "analytics") content = <AnalyticsView jobs={jobs} />;
  else if (view === "achievements") content = <AchievementsView jobs={jobs} />;

  return (
    <div style={{ fontFamily: "'Inter',sans-serif", display: "flex", height: "100vh", background: "#FBF7EF", color: "#17132A" }}>
      <style>{FONT_IMPORT}{`* { box-sizing: border-box; } ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#E4DFF0;border-radius:8px;}`}</style>
      <Sidebar view={view === "memberDetail" ? "team" : view === "projectDetail" ? "projects" : view} setView={(v) => { setView(v); }} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <Topbar jobs={jobs} onAdd={() => setModalJob(null)} onSearchNav={handleSearchNav} />
        <div style={{ flex: 1, overflowY: "auto", padding: 28 }}>{content}</div>
      </div>
      {modalJob !== undefined && (
        <JobModal initial={modalJob} onClose={() => setModalJob(undefined)} onSave={saveJob} onDelete={deleteJob} />
      )}
      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OhMyJobb />);
</script>
</body>
</html>
